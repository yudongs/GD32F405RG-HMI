<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKLink LCD Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  color: #e0e0e0;
  font-family: 'Consolas', 'Courier New', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
.header {
  text-align: center;
  margin-bottom: 16px;
}
.header h1 {
  font-size: 20px;
  color: #a0d0a0;
  letter-spacing: 2px;
}
.stats {
  display: flex;
  gap: 24px;
  margin-top: 8px;
  font-size: 13px;
  color: #888;
}
.stats span { color: #a0d0a0; font-weight: bold; }
.lcd-frame {
  background: #2a2a3a;
  border: 3px solid #444;
  border-radius: 4px;
  padding: 20px;
  box-shadow: 0 0 30px rgba(0, 180, 0, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.4);
}
.lcd-screen {
  display: block;
  image-rendering: pixelated;
  border: 1px solid #333;
}
.connection-status {
  margin-top: 12px;
  font-size: 12px;
  color: #666;
  text-align: center;
}
.connection-status.connected { color: #4a4; }
.connection-status.disconnected { color: #a44; }
</style>
</head>
<body>
<div class="header">
  <h1>GD32 LCD Framebuffer</h1>
  <div class="stats">
    分辨率: <span>240x160</span>
    FPS: <span id="fps">--</span>
    更新: <span id="last-update">--</span>
  </div>
</div>
<div class="lcd-frame">
  <canvas class="lcd-screen" id="lcd" width="480" height="320"></canvas>
</div>
<div class="connection-status" id="conn-status">正在连接...</div>

<script>
const canvas = document.getElementById('lcd');
const ctx = canvas.getContext('2d');

const FB_W = 240, FB_H = 160;
const SCALE = 2;  // canvas is 480x320 (2x scale)

let frameCount = 0;
let lastFpsUpdate = performance.now();
let fpsEl = document.getElementById('fps');
let updateEl = document.getElementById('last-update');
let statusEl = document.getElementById('conn-status');

// Pre-allocate ImageData for performance
const img = ctx.createImageData(FB_W, FB_H);

function renderFrame(fbBytes) {
  if (fbBytes.length < FB_W * FB_H / 8) return;

  const px = img.data;
  for (let y = 0; y < FB_H; y++) {
    for (let x = 0; x < FB_W; x++) {
      const byteIdx = y * 30 + (x >>> 3);
      const bit = (fbBytes[byteIdx] >>> (7 - (x & 7))) & 1;
      const off = (y * FB_W + x) << 2;
      if (bit) {
        // Pixel ON = dark (simulates LCD segment active)
        px[off]     = 0x20;
        px[off + 1] = 0x30;
        px[off + 2] = 0x20;
      } else {
        // Pixel OFF = light green (LCD background)
        px[off]     = 0xC0;
        px[off + 1] = 0xD8;
        px[off + 2] = 0xC0;
      }
      px[off + 3] = 255;
    }
  }

  // Draw to offscreen canvas at native resolution, then scale
  const offscreen = new OffscreenCanvas(FB_W, FB_H);
  const offCtx = offscreen.getContext('2d');
  offCtx.putImageData(img, 0, 0);

  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, FB_W * SCALE, FB_H * SCALE);
  ctx.drawImage(offscreen, 0, 0, FB_W * SCALE, FB_H * SCALE);

  frameCount++;
  const now = performance.now();
  if (now - lastFpsUpdate >= 1000) {
    const fps = Math.round(frameCount * 1000 / (now - lastFpsUpdate));
    fpsEl.textContent = fps;
    frameCount = 0;
    lastFpsUpdate = now;
  }
  updateEl.textContent = new Date().toLocaleTimeString();
}

// Base64 → Uint8Array
function base64ToBytes(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

// SSE connection
function connectSSE() {
  const es = new EventSource('/stream');
  es.onopen = () => {
    statusEl.textContent = '已连接';
    statusEl.className = 'connection-status connected';
  };
  es.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.fb_b64) {
        const fbBytes = base64ToBytes(data.fb_b64);
        renderFrame(fbBytes);
      }
    } catch (e) {
      // skip malformed data
    }
  };
  es.onerror = () => {
    statusEl.textContent = '连接断开，正在重连...';
    statusEl.className = 'connection-status disconnected';
    es.close();
    setTimeout(connectSSE, 2000);
  };
}

connectSSE();
</script>
</body>
</html>
