[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mklink_vtfp"
version = "0.1.0"
description = "VTFP v1 Python SDK — high-level agent for embedded MCUs via MKLink"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GEC6100D Project" }]
dependencies = [
    "vtfp_proto>=0.1.0",
    "pyserial>=3.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Embedded",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
